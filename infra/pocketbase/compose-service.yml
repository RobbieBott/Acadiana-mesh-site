# Added to /root/acadiana-stack/docker-compose.yml under "services:" by install.sh.
  pocketbase:
    # Repeater directory backend (data.acadianamesh.com) — code from infra/pocketbase in the site repo
    build: ./pocketbase
    image: acadiana-pocketbase:local
    container_name: pocketbase
    restart: unless-stopped
    env_file:
      - /root/acadiana-stack/pocketbase.env
    expose:
      - "8090"
    volumes:
      - /root/acadiana-stack/pocketbase/pb_data:/pb/pb_data
    mem_limit: 128m
    networks:
      - mesh
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
