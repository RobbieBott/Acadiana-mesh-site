name: Owner email integration
on:
  pull_request:
    paths:
      - 'infra/pocketbase/**'
      - 'assets/js/directory-activity.js'
      - 'assets/js/owner-mail.js'
      - 'assets/js/repeaters-manage.js'
      - 'repeaters-manage.html'
      - '.github/workflows/owner-mail.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Check frontend JavaScript
        run: |
          node --check assets/js/directory-activity.js
          node --check assets/js/owner-mail.js
          node --check assets/js/repeaters-manage.js
      - name: Test against PocketBase and an isolated SMTP server
        run: python3 infra/pocketbase/tests/owner_mail_integration.py
